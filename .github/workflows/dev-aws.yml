name: Deploy development to AWS

on:
  push:
    branches:
      - dev-sbrebeck
      - dev-simon
      - dev-glenn
      - dev-jonas
      - dev-nils
      - dev-daniel
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-aws.yml
    with:
      service-name: valio-${{ github.ref_name }}
    secrets: inherit
